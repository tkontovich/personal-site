{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Trent Kontovich{% endblock %}</title>

    <!-- Set the theme before anything paints: the saved choice, else the system setting. -->
    <script>
        (function () {
            var dark = false;
            try {
                var saved = localStorage.getItem('theme');
                dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            } catch (e) {}
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        })();
    </script>

    <link rel="icon" type="image/png" sizes="48x48" href="{% static 'mysite/favicon-48x48.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
    <link rel="stylesheet" href="{% static 'mysite/styles.css' %}?v=24">

    {% block script %}
    {% endblock %}

    <!-- Vercel Web Analytics. Served by Vercel at deploy time; 404s locally. -->
    <script defer src="/_vercel/insights/script.js"></script>
</head>

<body>
    <a class="skip-link" href="#content">Skip to content</a>

    <div class="page-width">
        <header class="site-header">
            <nav class="site-nav" aria-label="Main">
                <a class="site-brand" href="{% url 'index' %}">Trent Kontovich</a>
                <ul class="site-links">
                    <li><a href="{% url 'index' %}"{% if request.path == '/' %} aria-current="page"{% endif %}>Home</a></li>
                    <li><a href="{% url 'resume' %}"{% if request.path == '/resume/' %} aria-current="page"{% endif %}>Resume</a></li>
                </ul>
                <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
                </button>
            </nav>
        </header>
    </div>

    <main id="content" tabindex="-1">
        {% block body %}
        {% endblock %}
    </main>

    <div class="page-width">
        <footer class="site-footer">
            <p>&copy; 2026 Trent Kontovich</p>
        </footer>
    </div>

    <script>
        (function () {
            const root = document.documentElement;
            const toggle = document.getElementById('theme-toggle');

            function updateLabel() {
                const label = root.dataset.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
                toggle.setAttribute('aria-label', label);
                toggle.title = label;
            }

            toggle.addEventListener('click', function () {
                root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
                try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
                updateLabel();
            });
            updateLabel();
        })();
    </script>
</body>

</html>
